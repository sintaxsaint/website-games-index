<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loader</title>
</head>
<body>
    <script>
        // Get the game ID from the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        // Map of game IDs to their index.html paths
        // When integrating a new game, add it to this list
        const games = {
            "1": "games/test-game/index.html",
            "2": "games/1v1-lol/index.html",
            "3": "games/bloxorz/index.html",
            "4": "games/capybara-clicker/index.html",
            "5": "games/krunker/index.html",
            "6": "games/run3/index.html",
            "7": "games/sugar-sugar/index.html",
            "8": "games/time-shooter-3/index.html",
            "9": "games/worlds-hardest-game/index.html",
            "10": "games/slope/index.html",
            "11": "games/2048/index.html",
            "12": "games/alien-invasion/index.html",
            "13": "games/astray/index.html",
            "14": "games/canvas-tetris/index.html",
            "15": "games/clumsy-bird/index.html",
            "16": "games/floppybird/index.html",
            "17": "games/hextris/index.html",
            "18": "games/hexgl/index.html",
            "19": "games/javascript-racer/index.html",
            "20": "games/pacman-canvas/index.html",
            "21": "games/pong/index.html",
            "22": "games/tower-game/index.html",
            "23": "games/agent-8-ball/index.html",
            "24": "games/breakouts/index.html",
            "25": "games/duckhunt/index.html",
            "26": "games/fluid-table-tennis/index.html",
            "27": "games/javascript-tetris/index.html",
            "28": "games/minesweeper/index.html",
            "29": "games/mk.js/index.html",
            "30": "games/pacman/index.html",
            "31": "games/snake/index.html",
            "32": "games/solitaire/index.html",
            "33": "games/space-invaders/index.html",
            "34": "games/t-rex-runner/index.html",
            "35": "games/chrome-dinosaur/index.html",
            "36": "games/flappy-bird/index.html",
            "37": "games/geometry-dash/index.html",
            "38": "games/piano-tiles/index.html",
            "39": "games/agar-io/index.html"
        };

        if (gameId && games[gameId]) {
            // Redirect to the game
            window.location.href = games[gameId];
        } else {
            // Handle error
            document.body.innerHTML = "<h1>Error: Game not found or ID missing.</h1>";
            console.error("Game ID not found:", gameId);
        }
    </script>
</body>
</html>

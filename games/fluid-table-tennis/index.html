<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tennis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #scoreboard {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 20px;
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .score {
            background: rgba(0,0,0,0.3);
            padding: 10px 40px;
            border-radius: 10px;
            min-width: 120px;
            text-align: center;
        }
        .score span { font-size: 16px; display: block; margin-bottom: 5px; opacity: 0.7; }
        #tableContainer {
            position: relative;
            perspective: 800px;
        }
        #canvas {
            display: block;
            border-radius: 5px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            z-index: 100;
        }
        #message small {
            display: block;
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.7;
            font-weight: normal;
        }
        #controls {
            color: rgba(255,255,255,0.6);
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
        }
        #difficulty {
            margin-top: 15px;
        }
        #difficulty button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #difficulty button:hover, #difficulty button.active {
            background: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="scoreboard">
            <div class="score"><span>PLAYER</span><div id="playerScore">0</div></div>
            <div class="score"><span>CPU</span><div id="cpuScore">0</div></div>
        </div>
        <div id="tableContainer">
            <canvas id="canvas" width="900" height="500"></canvas>
            <div id="message">Table Tennis<small>Press SPACE to start</small></div>
        </div>
        <div id="controls">
            Use mouse or arrow keys to move your paddle
            <div id="difficulty">
                <button onclick="setDifficulty(0.03)" id="easy">Easy</button>
                <button onclick="setDifficulty(0.06)" id="medium" class="active">Medium</button>
                <button onclick="setDifficulty(0.1)" id="hard">Hard</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;

        const TABLE_COLOR = '#1a5f2a';
        const LINE_COLOR = '#fff';
        const PADDLE_W = 15, PADDLE_H = 90;
        const BALL_R = 10;
        const WIN_SCORE = 11;

        let playerY = H / 2 - PADDLE_H / 2;
        let cpuY = H / 2 - PADDLE_H / 2;
        let ballX = W / 2, ballY = H / 2;
        let ballVX = 0, ballVY = 0;
        let playerScore = 0, cpuScore = 0;
        let gameRunning = false;
        let cpuSpeed = 0.06;
        let rally = 0;
        let maxSpeed = 12;
        let particles = [];
        let lastHit = null;

        function setDifficulty(speed) {
            cpuSpeed = speed;
            document.querySelectorAll('#difficulty button').forEach(b => b.classList.remove('active'));
            if (speed === 0.03) document.getElementById('easy').classList.add('active');
            else if (speed === 0.06) document.getElementById('medium').classList.add('active');
            else document.getElementById('hard').classList.add('active');
        }

        function resetBall(direction) {
            ballX = W / 2;
            ballY = H / 2;
            const angle = (Math.random() - 0.5) * Math.PI / 3;
            const speed = 6;
            ballVX = Math.cos(angle) * speed * direction;
            ballVY = Math.sin(angle) * speed;
            rally = 0;
            lastHit = null;
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('rgb', 'rgba');
                ctx.fill();
            });
        }

        function drawTable() {
            ctx.fillStyle = TABLE_COLOR;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = LINE_COLOR;
            ctx.lineWidth = 3;
            ctx.strokeRect(10, 10, W - 20, H - 20);

            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(W / 2, 10);
            ctx.lineTo(W / 2, H - 10);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(10, H / 2);
            ctx.lineTo(W - 10, H / 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawPaddle(x, y, isPlayer) {
            const gradient = ctx.createLinearGradient(x, y, x + PADDLE_W, y);
            if (isPlayer) {
                gradient.addColorStop(0, '#c0392b');
                gradient.addColorStop(0.5, '#e74c3c');
                gradient.addColorStop(1, '#c0392b');
            } else {
                gradient.addColorStop(0, '#2980b9');
                gradient.addColorStop(0.5, '#3498db');
                gradient.addColorStop(1, '#2980b9');
            }

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(x, y, PADDLE_W, PADDLE_H, 5);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_R, 0, Math.PI * 2);

            const gradient = ctx.createRadialGradient(ballX - 3, ballY - 3, 0, ballX, ballY, BALL_R);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(0.3, '#f5f5f5');
            gradient.addColorStop(1, '#ddd');
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.stroke();

            if (gameRunning) {
                ctx.beginPath();
                ctx.arc(ballX - ballVX * 0.5, ballY - ballVY * 0.5, BALL_R * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();
            }
        }

        function drawRally() {
            if (rally > 2) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Rally: ' + rally, W / 2, 50);
            }
        }

        function update() {
            if (!gameRunning) return;

            ballX += ballVX;
            ballY += ballVY;

            if (ballY - BALL_R < 10) {
                ballY = 10 + BALL_R;
                ballVY *= -1;
                createParticles(ballX, ballY, 'rgb(255,255,255)');
            }
            if (ballY + BALL_R > H - 10) {
                ballY = H - 10 - BALL_R;
                ballVY *= -1;
                createParticles(ballX, ballY, 'rgb(255,255,255)');
            }

            const targetY = ballY - PADDLE_H / 2;
            const errorMargin = (1 - cpuSpeed * 10) * 30;
            const targetWithError = targetY + (Math.random() - 0.5) * errorMargin;
            cpuY += (targetWithError - cpuY) * cpuSpeed;
            cpuY = Math.max(10, Math.min(H - 10 - PADDLE_H, cpuY));

            if (ballX - BALL_R < 30 + PADDLE_W &&
                ballY > playerY && ballY < playerY + PADDLE_H &&
                ballX > 30 && lastHit !== 'player') {

                const hitPos = (ballY - playerY) / PADDLE_H - 0.5;
                const angle = hitPos * Math.PI / 3;

                rally++;
                const speedBoost = Math.min(1 + rally * 0.05, 1.5);
                const speed = Math.min(Math.abs(ballVX) * 1.05 * speedBoost, maxSpeed);

                ballVX = Math.cos(angle) * speed + speed * 0.7;
                ballVY = Math.sin(angle) * speed;
                ballX = 30 + PADDLE_W + BALL_R;
                lastHit = 'player';

                createParticles(ballX, ballY, 'rgb(231,76,60)');
            }

            if (ballX + BALL_R > W - 30 - PADDLE_W &&
                ballY > cpuY && ballY < cpuY + PADDLE_H &&
                ballX < W - 30 && lastHit !== 'cpu') {

                const hitPos = (ballY - cpuY) / PADDLE_H - 0.5;
                const angle = Math.PI - hitPos * Math.PI / 3;

                rally++;
                const speedBoost = Math.min(1 + rally * 0.05, 1.5);
                const speed = Math.min(Math.abs(ballVX) * 1.05 * speedBoost, maxSpeed);

                ballVX = -Math.abs(Math.cos(angle) * speed + speed * 0.7);
                ballVY = Math.sin(angle) * speed;
                ballX = W - 30 - PADDLE_W - BALL_R;
                lastHit = 'cpu';

                createParticles(ballX, ballY, 'rgb(52,152,219)');
            }

            if (ballX < 0) {
                cpuScore++;
                document.getElementById('cpuScore').textContent = cpuScore;
                checkWin();
                if (!checkWin()) resetBall(1);
            }
            if (ballX > W) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                if (!checkWin()) resetBall(-1);
            }

            updateParticles();
        }

        function checkWin() {
            if (playerScore >= WIN_SCORE) {
                gameRunning = false;
                showMessage('You Win!', 'Press SPACE to play again');
                return true;
            }
            if (cpuScore >= WIN_SCORE) {
                gameRunning = false;
                showMessage('CPU Wins!', 'Press SPACE to play again');
                return true;
            }
            return false;
        }

        function showMessage(title, subtitle) {
            const msg = document.getElementById('message');
            msg.innerHTML = title + '<small>' + subtitle + '</small>';
            msg.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            drawTable();
            drawPaddle(30, playerY, true);
            drawPaddle(W - 30 - PADDLE_W, cpuY, false);
            drawBall();
            drawParticles();
            drawRally();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const y = e.clientY - rect.top;
            playerY = Math.max(10, Math.min(H - 10 - PADDLE_H, y - PADDLE_H / 2));
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                if (!gameRunning) {
                    if (playerScore >= WIN_SCORE || cpuScore >= WIN_SCORE) {
                        playerScore = 0;
                        cpuScore = 0;
                        document.getElementById('playerScore').textContent = '0';
                        document.getElementById('cpuScore').textContent = '0';
                    }
                    hideMessage();
                    gameRunning = true;
                    resetBall(Math.random() > 0.5 ? 1 : -1);
                }
            }
            if (e.code === 'ArrowUp') {
                playerY = Math.max(10, playerY - 20);
            }
            if (e.code === 'ArrowDown') {
                playerY = Math.min(H - 10 - PADDLE_H, playerY + 20);
            }
        });

        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
            border: 3px solid #e94560;
        }
        
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info">
        <p>Press SPACE or Click to jump</p>
        <p>Avoid the obstacles!</p>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let gameOver = false;
        let level = 1;
        
        const player = {
            x: 50,
            y: 300,
            size: 30,
            velocityY: 0,
            jumping: false,
            draw() {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate((score / 100) * Math.PI * 2);
                ctx.fillStyle = '#e94560';
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            },
            update() {
                if (this.jumping) {
                    this.velocityY += 0.6;
                    this.y += this.velocityY;
                    
                    if (this.y >= 300) {
                        this.y = 300;
                        this.jumping = false;
                        this.velocityY = 0;
                    }
                }
            }
        };
        
        let obstacles = [];
        let obstacleCounter = 0;
        
        const createObstacle = () => {
            obstacles.push({
                x: canvas.width,
                y: 300,
                width: 20 + Math.random() * 30,
                height: 40,
                draw() {
                    ctx.fillStyle = '#f39c12';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                },
                update() {
                    this.x -= 8 + (level - 1) * 2;
                }
            });
        };
        
        document.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'ArrowUp') && !player.jumping) {
                e.preventDefault();
                player.jumping = true;
                player.velocityY = -12;
            }
            if (e.key === 'r' && gameOver) resetGame();
        });
        
        document.addEventListener('click', () => {
            if (!player.jumping) {
                player.jumping = true;
                player.velocityY = -12;
            } else if (gameOver) {
                resetGame();
            }
        });
        
        const resetGame = () => {
            score = 0;
            gameOver = false;
            level = 1;
            obstacles = [];
            obstacleCounter = 0;
            player.y = 300;
            player.velocityY = 0;
        };
        
        const checkCollision = (rect1, rect2) => {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.size > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.size > rect2.y;
        };
        
        const gameLoop = () => {
            ctx.fillStyle = 'rgba(15, 52, 96, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.lineTo(canvas.width, 330);
            ctx.stroke();
            
            if (!gameOver) {
                player.update();
                player.draw();
                
                obstacleCounter++;
                const spawnRate = Math.max(40, 100 - level * 10);
                if (obstacleCounter > spawnRate) {
                    createObstacle();
                    obstacleCounter = 0;
                }
                
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();
                    
                    if (checkCollision(player, obstacles[i])) {
                        gameOver = true;
                    }
                    
                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                        score += 10;
                        
                        if (score % 100 === 0) {
                            level++;
                        }
                    }
                }
            }
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Score: ' + score, 10, 30);
            ctx.fillText('Level: ' + level, 10, 60);
            
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = 'bold 20px Arial';
                ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 60);
            }
            
            requestAnimationFrame(gameLoop);
        };
        
        gameLoop();
    </script>
</body>
</html>

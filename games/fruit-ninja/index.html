<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            border: 3px solid #333;
            overflow: hidden;
            cursor: crosshair;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 10;
        }

        .score-box, .combo-box, .lives-box {
            background: rgba(255,255,255,0.8);
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
            z-index: 20;
            display: none;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #gameOver p {
            font-size: 28px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #gameOver button:hover {
            background: #764ba2;
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 14px;
            color: #666;
            background: rgba(255,255,255,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div class="score-box">Score: <span id="score">0</span></div>
            <div class="combo-box">Combo: <span id="combo">0</span>x</div>
            <div class="lives-box">Lives: <span id="lives">3</span></div>
        </div>
        <div id="gameOver">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Max Combo: <span id="maxCombo">0</span>x</p>
            <button onclick="location.reload()">Play Again</button>
        </div>
        <div class="instructions">Click/tap to slash fruit!</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 600;

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let lives = 3;
        let gameRunning = true;

        const fruits = [];
        const particles = [];
        const slashTrail = [];

        const fruitTypes = [
            { name: 'apple', color: '#FF0000', radius: 20 },
            { name: 'orange', color: '#FFA500', radius: 22 },
            { name: 'watermelon', color: '#00AA00', radius: 25 },
            { name: 'banana', color: '#FFFF00', radius: 18 },
            { name: 'pineapple', color: '#FFD700', radius: 20 },
            { name: 'bomb', color: '#1a1a1a', radius: 15, isBomb: true }
        ];

        class Fruit {
            constructor() {
                const type = Math.random() < 0.1 ? fruitTypes[5] : fruitTypes[Math.floor(Math.random() * 5)];
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = canvas.height + 30;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = -Math.random() * 10 - 8;
                this.type = type;
                this.sliced = false;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.vy += 0.3; // gravity
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.type.isBomb) {
                    ctx.fillStyle = this.type.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = this.type.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.restore();
            }

            isOffScreen() {
                return this.y > canvas.height + 50;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = Math.random() * -15 - 5;
                this.color = color;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.02;
            }

            update() {
                this.vy += 0.2;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function spawnFruit() {
            if (gameRunning && fruits.length < 8) {
                fruits.push(new Fruit());
            }
        }

        function checkSlice(x, y) {
            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];
                const dist = Math.hypot(fruit.x - x, fruit.y - y);

                if (dist < fruit.type.radius && !fruit.sliced) {
                    if (fruit.type.isBomb) {
                        lives--;
                        combo = 0;
                        if (lives <= 0) {
                            endGame();
                        }
                    } else {
                        fruit.sliced = true;
                        score += (10 + combo * 5);
                        combo++;
                        if (combo > maxCombo) maxCombo = combo;

                        for (let j = 0; j < 10; j++) {
                            particles.push(new Particle(fruit.x, fruit.y, fruit.type.color));
                        }

                        fruits.splice(i, 1);
                    }
                    updateUI();
                    break;
                }
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo;
            document.getElementById('lives').textContent = lives;
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('maxCombo').textContent = maxCombo;
        }

        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'rgba(135, 206, 235, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                fruits[i].update();
                fruits[i].draw();

                if (fruits[i].isOffScreen() && !fruits[i].sliced) {
                    lives--;
                    combo = 0;
                    updateUI();

                    if (lives <= 0) {
                        endGame();
                    }
                    fruits.splice(i, 1);
                }
            }

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Mouse/Touch input
        let isSlashing = false;

        document.addEventListener('mousedown', (e) => {
            isSlashing = true;
            const rect = canvas.getBoundingClientRect();
            checkSlice(e.clientX - rect.left, e.clientY - rect.top);
        });

        document.addEventListener('mousemove', (e) => {
            if (isSlashing) {
                const rect = canvas.getBoundingClientRect();
                checkSlice(e.clientX - rect.left, e.clientY - rect.top);
            }
        });

        document.addEventListener('mouseup', () => {
            isSlashing = false;
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            isSlashing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            checkSlice(touch.clientX - rect.left, touch.clientY - rect.top);
        });

        canvas.addEventListener('touchmove', (e) => {
            if (isSlashing) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                checkSlice(touch.clientX - rect.left, touch.clientY - rect.top);
            }
        });

        canvas.addEventListener('touchend', () => {
            isSlashing = false;
        });

        // Spawn fruits periodically
        setInterval(spawnFruit, 800);

        // Start game
        updateUI();
        gameLoop();
    </script>
</body>
</html>

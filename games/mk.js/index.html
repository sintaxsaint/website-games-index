<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighter Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 900px;
            margin-bottom: 10px;
            padding: 0 20px;
        }
        .player-hud {
            display: flex;
            flex-direction: column;
            width: 350px;
        }
        .player-hud.right { align-items: flex-end; }
        .player-name {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }
        .health-bar {
            width: 100%;
            height: 25px;
            background: #333;
            border: 3px solid #666;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .health-fill {
            height: 100%;
            transition: width 0.2s;
            position: relative;
        }
        .health-fill.p1 {
            background: linear-gradient(180deg, #4CAF50, #2E7D32);
            float: right;
        }
        .health-fill.p2 {
            background: linear-gradient(180deg, #f44336, #b71c1c);
        }
        .round-indicator {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .round-indicator.right { justify-content: flex-end; }
        .round-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #666;
        }
        .round-dot.won { background: #FFD700; border-color: #FFA000; }
        #roundInfo {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #canvas {
            display: block;
            border: 4px solid #333;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.8), 0 0 30px rgba(255,215,0,0.5);
            text-align: center;
            z-index: 100;
            display: none;
        }
        #controls {
            display: flex;
            justify-content: space-between;
            width: 900px;
            margin-top: 15px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
        }
        .control-box {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }
        .control-box h3 { margin-bottom: 8px; color: #fff; }
        .key {
            background: #444;
            padding: 2px 8px;
            border-radius: 3px;
            font-family: monospace;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div class="player-hud">
                <div class="player-name" style="color: #4CAF50;">Player 1</div>
                <div class="health-bar"><div class="health-fill p1" id="p1Health" style="width: 100%"></div></div>
                <div class="round-indicator">
                    <div class="round-dot" id="p1r1"></div>
                    <div class="round-dot" id="p1r2"></div>
                </div>
            </div>
            <div id="roundInfo">ROUND 1</div>
            <div class="player-hud right">
                <div class="player-name" style="color: #f44336;">Player 2</div>
                <div class="health-bar"><div class="health-fill p2" id="p2Health" style="width: 100%"></div></div>
                <div class="round-indicator right">
                    <div class="round-dot" id="p2r1"></div>
                    <div class="round-dot" id="p2r2"></div>
                </div>
            </div>
        </div>
        <div style="position: relative;">
            <canvas id="canvas" width="900" height="450"></canvas>
            <div id="message"></div>
        </div>
        <div id="controls">
            <div class="control-box">
                <h3>Player 1</h3>
                <span class="key">A</span><span class="key">D</span> Move |
                <span class="key">W</span> Jump |
                <span class="key">F</span> Punch |
                <span class="key">G</span> Kick |
                <span class="key">S</span> Block
            </div>
            <div class="control-box">
                <h3>Player 2</h3>
                <span class="key">←</span><span class="key">→</span> Move |
                <span class="key">↑</span> Jump |
                <span class="key">K</span> Punch |
                <span class="key">L</span> Kick |
                <span class="key">↓</span> Block
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        const GROUND = H - 80;
        const GRAVITY = 0.8;

        const keys = {};
        let gameState = 'ready';
        let currentRound = 1;
        let p1Rounds = 0, p2Rounds = 0;
        let messageTimer = 0;

        class Fighter {
            constructor(x, color, name, facingRight) {
                this.x = x;
                this.y = GROUND;
                this.vx = 0;
                this.vy = 0;
                this.width = 60;
                this.height = 120;
                this.color = color;
                this.name = name;
                this.facingRight = facingRight;
                this.health = 100;
                this.maxHealth = 100;
                this.state = 'idle';
                this.stateTimer = 0;
                this.attackBox = null;
                this.isBlocking = false;
                this.hitStun = 0;
                this.combo = 0;
                this.lastHitTime = 0;
            }

            reset(x) {
                this.x = x;
                this.y = GROUND;
                this.vx = 0;
                this.vy = 0;
                this.health = this.maxHealth;
                this.state = 'idle';
                this.stateTimer = 0;
                this.attackBox = null;
                this.isBlocking = false;
                this.hitStun = 0;
                this.combo = 0;
            }

            update(opponent) {
                if (this.hitStun > 0) {
                    this.hitStun--;
                    this.vx *= 0.8;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.y < GROUND) {
                    this.vy += GRAVITY;
                } else {
                    this.y = GROUND;
                    this.vy = 0;
                    if (this.state === 'jump') this.state = 'idle';
                }

                this.x = Math.max(30, Math.min(W - 30 - this.width, this.x));

                if (this.stateTimer > 0) {
                    this.stateTimer--;
                    if (this.stateTimer === 0) {
                        this.state = 'idle';
                        this.attackBox = null;
                    }
                }

                this.facingRight = this.x < opponent.x;

                this.vx *= 0.85;
            }

            punch() {
                if (this.state !== 'idle' && this.state !== 'walk') return;
                this.state = 'punch';
                this.stateTimer = 15;
                const offsetX = this.facingRight ? this.width : -40;
                this.attackBox = {
                    x: this.x + offsetX,
                    y: this.y - this.height + 30,
                    width: 50,
                    height: 30,
                    damage: 8,
                    knockback: 5,
                    type: 'punch'
                };
            }

            kick() {
                if (this.state !== 'idle' && this.state !== 'walk') return;
                this.state = 'kick';
                this.stateTimer = 20;
                const offsetX = this.facingRight ? this.width : -50;
                this.attackBox = {
                    x: this.x + offsetX,
                    y: this.y - this.height + 60,
                    width: 60,
                    height: 35,
                    damage: 12,
                    knockback: 8,
                    type: 'kick'
                };
            }

            jump() {
                if (this.y >= GROUND) {
                    this.vy = -16;
                    this.state = 'jump';
                }
            }

            draw() {
                ctx.save();

                const bodyX = this.x + this.width / 2;
                const bodyY = this.y;

                const baseColor = this.color;
                const darkColor = this.adjustColor(this.color, -30);
                const lightColor = this.adjustColor(this.color, 30);

                if (this.hitStun > 0 && this.hitStun % 4 < 2) {
                    ctx.globalAlpha = 0.6;
                }

                ctx.fillStyle = darkColor;
                ctx.beginPath();
                ctx.ellipse(bodyX, bodyY, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                const legSpread = this.state === 'kick' ? 25 : 12;
                const kickLegOffset = this.state === 'kick' ? (this.facingRight ? 30 : -30) : 0;

                ctx.strokeStyle = baseColor;
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(bodyX - 8, bodyY - 45);
                ctx.lineTo(bodyX - legSpread, bodyY - 10);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(bodyX + 8, bodyY - 45);
                ctx.lineTo(bodyX + legSpread + kickLegOffset, bodyY - 10 - (this.state === 'kick' ? 20 : 0));
                ctx.stroke();

                ctx.fillStyle = baseColor;
                ctx.beginPath();
                ctx.ellipse(bodyX, bodyY - 70, 22, 30, 0, 0, Math.PI * 2);
                ctx.fill();

                const armY = bodyY - 85;
                const punchOffset = this.state === 'punch' ? (this.facingRight ? 35 : -35) : 0;
                const blockOffset = this.isBlocking ? -15 : 0;

                ctx.strokeStyle = baseColor;
                ctx.lineWidth = 10;

                ctx.beginPath();
                ctx.moveTo(bodyX - 18, armY);
                if (this.isBlocking) {
                    ctx.lineTo(bodyX - 5, armY - 30);
                } else {
                    ctx.lineTo(bodyX - 35 + (this.facingRight ? 0 : punchOffset), armY + 15);
                }
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(bodyX + 18, armY);
                if (this.isBlocking) {
                    ctx.lineTo(bodyX + 5, armY - 30);
                } else {
                    ctx.lineTo(bodyX + 35 + (this.facingRight ? punchOffset : 0), armY + 15);
                }
                ctx.stroke();

                ctx.fillStyle = lightColor;
                ctx.beginPath();
                ctx.arc(bodyX, bodyY - 115, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                const eyeOffset = this.facingRight ? 5 : -5;
                ctx.beginPath();
                ctx.arc(bodyX + eyeOffset - 5, bodyY - 118, 4, 0, Math.PI * 2);
                ctx.arc(bodyX + eyeOffset + 5, bodyY - 118, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(bodyX + eyeOffset - 5 + (this.facingRight ? 1 : -1), bodyY - 118, 2, 0, Math.PI * 2);
                ctx.arc(bodyX + eyeOffset + 5 + (this.facingRight ? 1 : -1), bodyY - 118, 2, 0, Math.PI * 2);
                ctx.fill();

                if (this.isBlocking) {
                    ctx.strokeStyle = 'rgba(100, 200, 255, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(bodyX, bodyY - 70, 40, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            adjustColor(hex, amount) {
                const num = parseInt(hex.slice(1), 16);
                const r = Math.min(255, Math.max(0, (num >> 16) + amount));
                const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
                const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
                return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
            }

            getHitbox() {
                return {
                    x: this.x,
                    y: this.y - this.height,
                    width: this.width,
                    height: this.height
                };
            }
        }

        let player1 = new Fighter(150, '#2E7D32', 'Player 1', true);
        let player2 = new Fighter(650, '#c62828', 'Player 2', false);
        let particles = [];
        let shakeAmount = 0;

        function createHitParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    life: 1,
                    color,
                    size: Math.random() * 8 + 4
                });
            }
        }

        function checkHit(attacker, defender) {
            if (!attacker.attackBox || attacker.stateTimer < 8) return;

            const atk = attacker.attackBox;
            const def = defender.getHitbox();

            if (atk.x < def.x + def.width && atk.x + atk.width > def.x &&
                atk.y < def.y + def.height && atk.y + atk.height > def.y) {

                if (defender.isBlocking) {
                    defender.vx = (attacker.facingRight ? 1 : -1) * atk.knockback * 0.3;
                    createHitParticles(atk.x + atk.width / 2, atk.y + atk.height / 2, '#64B5F6');
                    shakeAmount = 3;
                } else {
                    const now = Date.now();
                    if (now - attacker.lastHitTime < 1000) {
                        attacker.combo++;
                    } else {
                        attacker.combo = 1;
                    }
                    attacker.lastHitTime = now;

                    const comboDamage = atk.damage * (1 + attacker.combo * 0.1);
                    defender.health = Math.max(0, defender.health - comboDamage);
                    defender.hitStun = 15;
                    defender.vx = (attacker.facingRight ? 1 : -1) * atk.knockback;
                    defender.vy = -5;

                    createHitParticles(atk.x + atk.width / 2, atk.y + atk.height / 2, '#FFEB3B');
                    shakeAmount = 8;
                }

                attacker.attackBox = null;
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fill();
                ctx.globalAlpha = 1;
            });
        }

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a1a2e');
            grad.addColorStop(0.5, '#16213e');
            grad.addColorStop(1, '#0f0f23');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#2a2a4a';
            for (let i = 0; i < 8; i++) {
                const x = 50 + i * 120;
                const h = 100 + Math.sin(i * 1.5) * 50;
                ctx.fillRect(x, H - 80 - h, 80, h);
                ctx.fillStyle = '#3a3a5a';
                ctx.fillRect(x + 10, H - 70 - h, 15, 30);
                ctx.fillRect(x + 55, H - 60 - h, 15, 20);
                ctx.fillStyle = '#2a2a4a';
            }

            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(0, GROUND, W, H - GROUND);

            ctx.strokeStyle = '#5a4a3a';
            ctx.lineWidth = 2;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, GROUND);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
        }

        function updateUI() {
            document.getElementById('p1Health').style.width = player1.health + '%';
            document.getElementById('p2Health').style.width = player2.health + '%';
            document.getElementById('roundInfo').textContent = 'ROUND ' + currentRound;

            document.getElementById('p1r1').className = 'round-dot' + (p1Rounds >= 1 ? ' won' : '');
            document.getElementById('p1r2').className = 'round-dot' + (p1Rounds >= 2 ? ' won' : '');
            document.getElementById('p2r1').className = 'round-dot' + (p2Rounds >= 1 ? ' won' : '');
            document.getElementById('p2r2').className = 'round-dot' + (p2Rounds >= 2 ? ' won' : '');
        }

        function showMessage(text, duration = 2000) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            messageTimer = duration;
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function handleInput() {
            if (gameState !== 'fighting') return;

            if (keys['KeyA']) player1.vx = -6;
            if (keys['KeyD']) player1.vx = 6;
            if (keys['KeyW']) player1.jump();
            if (keys['KeyF']) player1.punch();
            if (keys['KeyG']) player1.kick();
            player1.isBlocking = keys['KeyS'] && player1.y >= GROUND;

            if (keys['ArrowLeft']) player2.vx = -6;
            if (keys['ArrowRight']) player2.vx = 6;
            if (keys['ArrowUp']) player2.jump();
            if (keys['KeyK']) player2.punch();
            if (keys['KeyL']) player2.kick();
            player2.isBlocking = keys['ArrowDown'] && player2.y >= GROUND;
        }

        function checkRoundEnd() {
            if (player1.health <= 0 || player2.health <= 0) {
                gameState = 'roundEnd';

                if (player1.health <= 0) {
                    p2Rounds++;
                    showMessage('Player 2 wins the round!');
                } else {
                    p1Rounds++;
                    showMessage('Player 1 wins the round!');
                }

                setTimeout(() => {
                    if (p1Rounds >= 2) {
                        showMessage('PLAYER 1 WINS!');
                        gameState = 'gameOver';
                    } else if (p2Rounds >= 2) {
                        showMessage('PLAYER 2 WINS!');
                        gameState = 'gameOver';
                    } else {
                        currentRound++;
                        startRound();
                    }
                }, 2000);
            }
        }

        function startRound() {
            player1.reset(150);
            player2.reset(650);
            particles = [];
            updateUI();
            showMessage('ROUND ' + currentRound, 1500);
            setTimeout(() => {
                showMessage('FIGHT!', 1000);
                setTimeout(() => {
                    hideMessage();
                    gameState = 'fighting';
                }, 1000);
            }, 1500);
        }

        function resetGame() {
            currentRound = 1;
            p1Rounds = 0;
            p2Rounds = 0;
            startRound();
        }

        function gameLoop() {
            if (shakeAmount > 0) {
                ctx.save();
                ctx.translate(
                    (Math.random() - 0.5) * shakeAmount,
                    (Math.random() - 0.5) * shakeAmount
                );
                shakeAmount *= 0.8;
                if (shakeAmount < 0.5) shakeAmount = 0;
            }

            drawBackground();

            if (gameState === 'fighting') {
                handleInput();
                player1.update(player2);
                player2.update(player1);
                checkHit(player1, player2);
                checkHit(player2, player1);
                checkRoundEnd();
            }

            updateParticles();

            player1.draw();
            player2.draw();
            drawParticles();

            updateUI();

            if (shakeAmount > 0) {
                ctx.restore();
            }

            if (messageTimer > 0) {
                messageTimer -= 16;
                if (messageTimer <= 0 && gameState === 'fighting') {
                    hideMessage();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', e => {
            keys[e.code] = true;

            if (e.code === 'Space') {
                if (gameState === 'ready') {
                    startRound();
                } else if (gameState === 'gameOver') {
                    resetGame();
                }
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        showMessage('Press SPACE to start');
        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run 3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        .container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 20px;
            max-width: 90vw;
            max-height: 90vh;
        }
        
        h1 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }
        
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 600px;
        }
        
        #ruffle {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Run 3</h1>
        <div id="game-container">
            <object id="ruffle" data="Run3.swf" type="application/x-shockwave-flash"></object>
        </div>
    </div>

    <!-- Ruffle Flash Emulator from CDN with fallback -->
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    
    <script>
        // Initialize Ruffle and load the SWF
        window.addEventListener('RuffleAPIEvent', (e) => {
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("game-container");
                container.innerHTML = '';
                container.appendChild(player);
                player.load("Run3.swf");
            }
        });

        // Fallback if API event doesn't fire
        setTimeout(() => {
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("game-container");
                if (container.querySelector('object')) {
                    container.innerHTML = '';
                }
                container.appendChild(player);
                player.load("Run3.swf");
            }
        }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #ruffle {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <object id="ruffle" data="Run3.swf" type="application/x-shockwave-flash"></object>
    </div>

    <!-- Ruffle Flash Emulator from CDN with fallback -->
    <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
    
    <script>
        // Initialize Ruffle and load the SWF
        window.addEventListener('RuffleAPIEvent', (e) => {
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("game-container");
                container.innerHTML = '';
                container.appendChild(player);
                player.load("Run3.swf");
            }
        });

        // Fallback if API event doesn't fire
        setTimeout(() => {
            if (window.RufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("game-container");
                if (container.querySelector('object')) {
                    container.innerHTML = '';
                }
                container.appendChild(player);
                player.load("Run3.swf");
            }
        }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            border: 3px solid #333;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }
        
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info">
        <p>Click or Press SPACE to flap</p>
        <p>Avoid the pipes!</p>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let gameOver = false;
        
        // Bird
        const bird = {
            x: 50,
            y: 300,
            radius: 15,
            velocityY: 0,
            draw() {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Eye
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
            },
            update() {
                this.velocityY += 0.4; // gravity
                this.y += this.velocityY;
                
                // Max fall speed
                if (this.velocityY > 10) this.velocityY = 10;
            },
            flap() {
                this.velocityY = -7;
            }
        };
        
        // Pipes
        let pipes = [];
        let pipeTimer = 0;
        
        const createPipe = () => {
            const gapSize = 120;
            const minHeight = 40;
            const maxHeight = canvas.height - gapSize - minHeight;
            const pipeX = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                y: pipeX,
                width: 60,
                gapSize: gapSize,
                passed: false,
                draw() {
                    ctx.fillStyle = '#2ecc71';
                    // Top pipe
                    ctx.fillRect(this.x, 0, this.width, this.y);
                    // Bottom pipe
                    ctx.fillRect(this.x, this.y + this.gapSize, this.width, canvas.height - this.y - this.gapSize);
                    
                    // Pipe caps
                    ctx.fillStyle = '#27ae60';
                    ctx.fillRect(this.x - 5, this.y - 10, this.width + 10, 10);
                    ctx.fillRect(this.x - 5, this.y + this.gapSize, this.width + 10, 10);
                },
                update() {
                    this.x -= 5;
                }
            });
        };
        
        // Input
        document.addEventListener('click', () => {
            if (!gameOver) bird.flap();
            else resetGame();
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                if (!gameOver) bird.flap();
                else resetGame();
            }
        });
        
        const resetGame = () => {
            score = 0;
            gameOver = false;
            pipes = [];
            pipeTimer = 0;
            bird.y = 300;
            bird.velocityY = 0;
        };
        
        const checkCollision = (bird, pipe) => {
            if (bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipe.width) {
                if (bird.y - bird.radius < pipe.y || bird.y + bird.radius > pipe.y + pipe.gapSize) {
                    return true;
                }
            }
            return false;
        };
        
        const gameLoop = () => {
            // Draw sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!gameOver) {
                bird.update();
                bird.draw();
                
                pipeTimer++;
                if (pipeTimer > 100) {
                    createPipe();
                    pipeTimer = 0;
                }
                
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();
                    pipes[i].draw();
                    
                    // Check collision
                    if (checkCollision(bird, pipes[i])) {
                        gameOver = true;
                    }
                    
                    // Score
                    if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                        pipes[i].passed = true;
                        score++;
                    }
                    
                    if (pipes[i].x + pipes[i].width < 0) {
                        pipes.splice(i, 1);
                    }
                }
                
                // Boundaries
                if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                    gameOver = true;
                }
            }
            
            // Draw score
            ctx.fillStyle = '#000';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('Score: ' + score, 10, 40);
            
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = 'bold 20px Arial';
                ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Click to restart', canvas.width / 2, canvas.height / 2 + 60);
            }
            
            requestAnimationFrame(gameLoop);
        };
        
        gameLoop();
    </script>
</body>
</html>

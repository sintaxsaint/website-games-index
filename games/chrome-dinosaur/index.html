<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dinosaur</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            border: 2px solid #333;
            background: #f7f7f7;
        }
        
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info">
        <p>Press SPACE or UP ARROW to jump</p>
        <p>Avoid the obstacles!</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 400;
        
        // Game variables
        let score = 0;
        let gameOver = false;
        
        // Dinosaur object
        const dino = {
            x: 50,
            y: 250,
            width: 40,
            height: 50,
            velocityY: 0,
            jumping: false,
            draw() {
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // Draw eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 10, this.y + 15, 5, 5);
                ctx.fillRect(this.x + 25, this.y + 15, 5, 5);
            },
            update() {
                if (this.jumping) {
                    this.velocityY += 0.6; // gravity
                    this.y += this.velocityY;
                    
                    if (this.y >= 250) {
                        this.y = 250;
                        this.jumping = false;
                        this.velocityY = 0;
                    }
                }
            }
        };
        
        // Obstacles
        let obstacles = [];
        let obstacleCounter = 0;
        
        const createObstacle = () => {
            obstacles.push({
                x: canvas.width,
                y: 300,
                width: 30,
                height: 50,
                draw() {
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                },
                update() {
                    this.x -= 8;
                }
            });
        };
        
        // Input handling
        document.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'ArrowUp') && !dino.jumping) {
                dino.jumping = true;
                dino.velocityY = -12;
            }
            if (e.key === 'r' && gameOver) {
                resetGame();
            }
        });
        
        const resetGame = () => {
            score = 0;
            gameOver = false;
            obstacles = [];
            obstacleCounter = 0;
            dino.y = 250;
        };
        
        const checkCollision = (rect1, rect2) => {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        };
        
        const gameLoop = () => {
            // Clear canvas
            ctx.fillStyle = '#f7f7f7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 320);
            ctx.lineTo(canvas.width, 320);
            ctx.stroke();
            
            if (!gameOver) {
                // Update and draw dino
                dino.update();
                dino.draw();
                
                // Create obstacles
                obstacleCounter++;
                if (obstacleCounter > 80) {
                    createObstacle();
                    obstacleCounter = 0;
                }
                
                // Update and draw obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].update();
                    obstacles[i].draw();
                    
                    // Check collision
                    if (checkCollision(dino, obstacles[i])) {
                        gameOver = true;
                    }
                    
                    // Remove off-screen obstacles
                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                        score += 10;
                    }
                }
                
                // Increase difficulty
                if (score > 0 && score % 200 === 0) {
                    for (let obs of obstacles) {
                        obs.width = Math.max(20, obs.width - 2);
                    }
                }
            }
            
            // Draw score
            ctx.fillStyle = '#333';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Score: ' + score, 10, 30);
            
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = 'bold 20px Arial';
                ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 60);
            }
            
            requestAnimationFrame(gameLoop);
        };
        
        gameLoop();
    </script>
</body>
</html>
